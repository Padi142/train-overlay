      additionalProperties: true

    # ------------------------------------------------------------------
    # CGWS
    # ------------------------------------------------------------------
    CgwsEnvelope:
      type: object
      required: [param]
      description: >
        Every CGWS/support call wraps its payload: {"param": {...}} where the
        inner object always starts with ServiceVersion/AppVersion/AppId/Lang/
        Country/DensityDpi.
      properties:
        param:
          type: object
          properties:
            ServiceVersion: { type: string, example: '1' }
            AppVersion: { type: string, description: 'versionCode as string'}
            AppId: { type: string, example: cz.cd.mujvlak.an }
            Lang: { type: string, example: cs }
            Country: { type: string, example: CZ }
            DensityDpi: { type: integer }
          additionalProperties: true

    CgwsVersionNode:
      type: object
      additionalProperties: true

    CgwsTtNode:
      type: object
      additionalProperties: true

security: []
