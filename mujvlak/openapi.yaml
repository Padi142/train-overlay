      tags: [IPWS – Session & Login]
      summary: URL of a agreement (GDPR/business terms) document
      operationId: ipwsGetAgreementsUrl
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/IpwsSessionEnvelope' } } } }
      responses:
        '200': { description: Agreement URL, content: { application/json: { schema: { $ref: '#/components/schemas/IpwsDataResponse' } } } }

  /IP.svc/GetCustomerSatisfactionQuestions:
    post:
      tags: [IPWS – Misc]
      summary: Customer-satisfaction questionnaire definition
      operationId: ipwsGetCustomerSatisfactionQuestions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/IpwsSessionEnvelope'
                - type: object
                  properties:
                    aoAnswers:
                      type: array
                      items:
                        type: object
                        properties:
                          iId: { type: integer }
                          iAnswer: { type: integer }
                          iVersion: { type: integer }
      responses:
        '200': { description: Questions, content: { application/json: { schema: { $ref: '#/components/schemas/IpwsDataResponse' } } } }

  /IP.svc/GetGoogleWalletPasses:
    post:
      tags: [IPWS – Tickets]
      summary: Google Wallet pass objects for tickets
      operationId: ipwsGetGoogleWalletPasses
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/IpwsSessionEnvelope' } } } }
      responses:
        '200': { description: Passes, content: { application/json: { schema: { $ref: '#/components/schemas/IpwsDataResponse' } } } }

  /IP.svc/GetCARechargeData:
    post:
      tags: [IPWS – Tickets]
      summary: ČD-kredit (customer account) recharge data
      operationId: ipwsGetCARechargeData
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/IpwsSessionEnvelope' } } } }
      responses:
        '200': { description: Recharge data, content: { application/json: { schema: { $ref: '#/components/schemas/IpwsDataResponse' } } } }

  # =====================================================================
  # C) CGWS — https://cd-ws.circlegate.com/AndroidService.svc/{path}/
  # =====================================================================

  /checkversions/:
    post:
      tags: [CGWS]
      summary: Check versions of downloadable/offline data packages
      operationId: cgwsCheckVersions
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CgwsEnvelope' }
      responses:
        '200':
          description: Version nodes
          content:
            application/json:
              schema:
                type: object
                properties:
                  ErrorCode: { type: integer, description: '0 = OK'}
                  ErrorMsg: { type: string }
                  Result:
                    type: array
                    items: { $ref: '#/components/schemas/CgwsVersionNode' }

  /ttcatalogue/:
    post:
      tags: [CGWS]
      summary: Offline timetable catalogue (list of downloadable timetables)
      operationId: cgwsTtCatalogue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CgwsEnvelope'
                - type: object
                  properties:
                    TtIdents: { type: array, items: { type: string } }
                    AutocompleteOnly: { type: array, items: { type: boolean } }
                    DeviceToken: { type: string, nullable: true }
      responses:
        '200':
          description: Timetable nodes
          content:
            application/json:
              schema:
                type: object
                properties:
                  ErrorCode: { type: integer }
                  ErrorMsg: { type: string }
                  Result:
                    type: array
                    items: { $ref: '#/components/schemas/CgwsTtNode' }

  # =====================================================================
  # D) Support WS — https://wsandroid.circlegate.com/ServiceContractV7.svc/{path}/
  # =====================================================================

  /uploadsupportrequestdata/:
    post:
      tags: [Support WS]
      summary: Upload a user problem report (text + attachments metadata)
      operationId: wsUploadSupportRequestData
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CgwsEnvelope' }
      responses:
        '200':
          description: Report accepted
          content: { application/json: { schema: { $ref: '#/components/schemas/IpwsDataResponse' } } }

components:
  securitySchemes: {}

  schemas:
    # ------------------------------------------------------------------
    # MapPhone shared enums & objects
    # ------------------------------------------------------------------
    MapPhoneStatus:
      type: string
      description: |
        Business status returned by every MapPhone endpoint. The full enum from
        `cz.odp.mapphonelib.api.MapPhoneStatus` (client also maps transport errors
        onto NETWORK_ERROR / SERVER_NOT_RESPONDING, which the server never sends).
      enum:
        - OK
        - UNKNOWN
        - WRONG_DATA
        - ACCOUNT_ALREADY_EXISTS
        - ACCOUNT_CREATED_EMAIL_NOT_SENT
        - ACCOUNT_DOES_NOT_EXIST
        - ACCOUNT_ALREADY_CONFIRMED
        - INVALID_ACCOUNT_STATUS
        - INVALID_ACTIVATION_CODE
        - INVALID_ACTIVATION_CODE_EMAIL_RESENT
        - INVALID_ACTIVATION_CODE_EMAIL_RESENT_SENDING_FAILED
        - WRONG_PIN
        - TANDEM_BOUND
        - TANDEM_CREATED_AND_BOUND
        - DEVICE_UNKNOWN
        - TANDEM_NOT_BOUND
        - PIN_CHANGED_SENDING_FAILED
        - IDENTITY_PACK_LOADING_LIMIT_REACHED
        - INVALID_CRC
        - INVALID_CREDENTIALS
        - NO_SUCH_IDENTITY_PACK
        - INVALID_IDENTITY_PACK_STATUS
        - EMAIL_SENDING_FAILED
        - TANDEM_UNKNOWN
        - TRY_AGAIN_LATER
        - CONFIG_ERROR
        - MAX_ACCOUNTS_FOR_EMAIL_REACHED
        - PRODUCT_DOES_NOT_EXIST
        - INVALID_PRODUCT_STATUS
        - PRODUCT_CANCEL_FAILED
        - PRODUCT_ID_ALREADY_USED
        - XML_PARSING_ERROR
        - PRODUCT_TEMPLATE_DOES_NOT_EXIST
        - FILE_NOT_FOUND
        - ACCOUNT_CANNOT_BE_DELETED
        - CARD_UNKNOWN_IN_POMK
        - CARD_NOT_PAIRED_IN_AZAK
        - POMK_CONNECTOIK_INVALIDTYPE
        - POMK_CONNECTOIK_ISSET
        - POMK_CONNECTOIK_ISSUE
        - POMK_CONNECTOIK_STATUS
        - POMK_CONNECTOIK_TRANSFERTOVIK
        - POMK_UNKNOWN_ERROR
        - PHOTO_INVALID
        - NO_JOURNEY_CONNECTION
        - PARKING_NOT_AVAILABLE
        - PARKING_ZONE_DOES_NOT_EXIST
        - PARKING_TIME_OVERLAP
        - PARKING_SECURE_INTERVAL
        - CRWS_ERROR
        - CRWS_CONN_HANDLE_RELEASED
        - CARD_UNKNOWN_IN_PORTAL_TELMAX
        - PORTAL_TELMAX_ERROR
        - PORTAL_TELMAX_EMAIL_NOT_CONFIRMED
        - PORTAL_TELMAX_ACCOUNT_TAKEN
        - IDENTIFIER_UNKNOWN_IN_DNCORE
        - OAUTH2_TOKENS_INVALID
        - IDENTITY_PACK_LISTENER_ERROR
        - MULTIPLE_FACES
        - NO_FACE
        - FACE_WRONG_POSITION
        - OIK_2_VIK_NOT_ALLOWED_IN_POMK
        - NETWORK_ERROR
        - TOO_MANY_PRODUCTS_TO_SHOW
        - SERVER_NOT_RESPONDING

    MapPhoneStatusResult:
      type: object
      description: Generic response that carries only the status.
      required: [Status]
      properties:
        Status: { $ref: '#/components/schemas/MapPhoneStatus' }

    MobileAppVersion:
      type: object
      properties:
        Name: { type: string }
        Platform: { type: string }
        IsUpdateForced: { type: boolean }
        IsUpdateRecommended: { type: boolean }

    BindAccountInput:
      type: object
      description: |
        Login for the MapPhone account backend. IMPORTANT: UserName is the
        **IN-Karta card number** (sCardNum of the card activated in the app),
        not the e-mail — MapPhoneFragment passes sCardNum from the IK list as
        the first argument of bindAccount(). PIN is the **ČD e-shop password**
        (the app prompts "enter the password to your ČD account"). Accounts
        only exist for users who activated an IN-Karta/VIK in the app; an
        e-mail in UserName yields Status ACCOUNT_DOES_NOT_EXIST.
      required: [UserName, DeviceID]
      properties:
        UserName: { type: string, description: 'IN-Karta card number (not the e-mail!)'}
        DeviceID: { type: string, description: 'Installation/device GUID generated by the app'}
        PushDeviceID: { type: string, nullable: true, description: 'FCM token'}
        PIN: { type: string, nullable: true, description: 'ČD e-shop password'}
        DeviceInfo: { type: string, nullable: true }

    BindAccountResult:
      type: object
      required: [Status]
      properties:
        Status: { $ref: '#/components/schemas/MapPhoneStatus' }
        PublicKeyXML: { type: string, nullable: true, description: 'XML-encoded account public key'}
        Email: { type: string, nullable: true }
        EndOfValidity: { type: string, nullable: true, description: 'yyyyMMdd' }

    DeleteAccountInput:
      type: object
      required: [UserName, DeviceID, PIN]
      properties:
        UserName: { type: string }
        DeviceID: { type: string }
        PIN: { type: string }

    DevicePinAccountInput:
      type: object
      required: [UserName, DeviceID, PIN]
      properties:
        UserName: { type: string }
        DeviceID: { type: string }
        PIN: { type: string }

    NewAccountInput:
      type: object
      required: [UserName, Email, PIN]
      properties:
        UserName: { type: string }
        Email: { type: string }
        PIN: { type: string }

    ConfirmAccountInput:
      type: object
      required: [UserName, ValidityCode]
      properties:
        UserName: { type: string }
        ValidityCode: { type: string, description: 'Code from confirmation e-mail'}

    NewConfirmedAccountInput:
      type: object
      required: [DeviceID, DeviceInfo, Email, PIN, PushDeviceID, IdentityPackData]
      properties:
        DeviceID: { type: string }
        DeviceInfo: { type: string }
        Email: { type: string }
        PIN: { type: string }
        PrevUsername: { type: string, nullable: true }
        PushDeviceID: { type: string }
        DetectFace: { type: boolean, description: 'Server-side face detection on the photo'}
        IdentityPackData: { $ref: '#/components/schemas/IdentityPackInputData' }

    IdentityPackInputData:
      type: object
      description: Digital identity card (name, photo, address…) used for IN-Karta.
      properties:
        PhotoHQ: { type: string, description: 'Base64 JPEG'}
        HolderName: { type: string }
        HolderBirth: { type: string, nullable: true, description: 'yyyyMMdd' }
        HolderSex: { type: string, example: MALE }
        HolderGeoCode: { type: string }
        HolderState: { type: string }
        HolderType: { type: integer }
        PostalCode: { type: integer, nullable: true }
        PostalCodeTemp: { type: integer, nullable: true }
        AdditionalInfo: { type: string, nullable: true }
        ServiceProviderSpecificData: { type: string, nullable: true, description: 'Base64'}

    SetIdentityPackInput:
      type: object
      required: [DeviceID, UserName, PIN, IdentityPackData]
      properties:
        DeviceID: { type: string }
        UserName: { type: string }
        PIN: { type: string }
        IdentityPackData: { $ref: '#/components/schemas/IdentityPackInputData' }
        DetectFace: { type: boolean }

    ChangePINInput:
      type: object
      required: [UserName, DeviceID, OldPIN, NewPIN]
      properties:
        UserName: { type: string }
        DeviceID: { type: string }
        OldPIN: { type: string }
        NewPIN: { type: string }

    ForgottenPINInput:
      type: object
      required: [UserName]
      properties:
        UserName: { type: string }
        User: { type: string, nullable: true, description: 'delivery selector'}
        Password: { type: string, nullable: true, description: 'delivery selector'}

    UpdatePushDeviceIdInput:
      type: object
      required: [DeviceID, PushDeviceID]
      properties:
        DeviceID: { type: string }
        PushDeviceID: { type: string }

    PmdpBindExistingInput:
      type: object
      required: [Email, DeviceID]
      properties:
        Email: { type: string }
        DeviceID: { type: string }
        DeviceInfo: { type: string }
        PhoneName: { type: string }
        PIN: { type: string }
        PushDeviceID: { type: string }

    PaymentInfo:
      type: object
      description: Payment initiation info (CSOB payment gateway).
      required: [PaymentMethod, ReturnMethod, ReturnURL]
      properties:
        PaymentMethod: { type: string, description: 'e.g. CSOB_GATEWAY, MASTERPASS, GOOGLE_PAY, …'}
        ReturnMethod: { type: string }
        ReturnURL: { type: string }
        Save: { type: boolean, nullable: true }

    PaymentResultInfo:
      type: object
      properties:
        IsOK: { type: boolean, nullable: true }
        ErrorMessage: { type: string, nullable: true }
        MPTransactionID: { type: string, nullable: true }
        CSOBGatewayPayID: { type: string, nullable: true }
        CSOBGatewayURL: { type: string, nullable: true, description: 'Redirect URL to the CSOB payment gateway'}

    NewExternalProductInput:
      type: object
      required: [DeviceID, UserName, TemplateID]
      properties:
        DeviceID: { type: string }
        UserName: { type: string }
        TemplateID: { type: string }
        Count: { type: integer, nullable: true }
        PaymentInfo: { $ref: '#/components/schemas/PaymentInfo' }

    NewParkingViaMasterpassInput:
      type: object
      required: [UserName, DeviceID, ParkingZoneID, CarID, BeginDateTime, EndDateTime]
      properties:
        UserName: { type: string }
        DeviceID: { type: string }
        ParkingZoneID: { type: string }
        CarID: { type: string, description: 'licence plate'}
        BeginDateTime: { type: string }
        EndDateTime: { type: string }

    ComputeJourneyInput:
      type: object
      required: [DeviceID, From, To]
      properties:
        DeviceID: { type: string }
        From: { type: string }
        To: { type: string }
        Via: { type: string, nullable: true }
        ProfileID: { type: string, nullable: true }

    ComputeJourneyResult:
      type: object
      properties:
        Status: { $ref: '#/components/schemas/MapPhoneStatus' }
        Price: { type: string, nullable: true }
        PriceCurrencyCode: { type: string, nullable: true }
        Length: { type: string, nullable: true }
        Stations: { type: array, items: { $ref: '#/components/schemas/JourneyStationItem' } }

    FindJourneyStationsInput:
      type: object
      required: [DeviceID, SearchInput]
      properties:
        DeviceID: { type: string }
        SearchInput: { type: string }

    JourneyStationItem:
      type: object
      properties:
        ID: { type: string }
        Name: { type: string }

    GetJourneyProfilesInput:
      type: object
      required: [DeviceID]
      properties:
        DeviceID: { type: string }

    JourneyProfileItem:
      type: object
      properties:
        ID: { type: string }
        Name: { type: string }
        BasicPrice: { type: string }
        KmPrice: { type: string }

    NewJourneyTicketInput:
      type: object
      required: [UserName, DeviceID, From, To, ProfileID]
      properties:
        UserName: { type: string }
        DeviceID: { type: string }
        From: { type: string }
        To: { type: string }
        Via: { type: string, nullable: true }
        ProfileID: { type: string }

    SearchCrwsConnectionsInput:
      type: object
      required: [DeviceID, From, To, When]
      properties:
        DeviceID: { type: string }
        From: { $ref: '#/components/schemas/TMapyGlobalListItemInfo' }
        To: { $ref: '#/components/schemas/TMapyGlobalListItemInfo' }
        When: { type: string, description: 'yyyyMMddHHmm' }
        IsTimeOfDeparture: { type: boolean }

    NewCrwsJourneyTicketInput:
      type: object
      required: [UserName, DeviceID, HandleID, CombID, Connection]
      properties:
        UserName: { type: string }
        DeviceID: { type: string }
        HandleID: { type: integer }
        CombID: { type: string }
        Connection: { $ref: '#/components/schemas/TMapyConnectionInfo' }
        discountClaim:
          description: Note — the JSON key really is lowercase "discountClaim".
          $ref: '#/components/schemas/TMapyDiscountClaim'

    SortimentGroup:
      type: object
      properties:
        Name: { type: string }
        Items:
          type: array
          items: { $ref: '#/components/schemas/SortimentItem' }

    SortimentItem:
      type: object
      properties:
        ID: { type: string }
        Name: { type: string }
        Description: { type: string }
        Price: { type: string }
        PriceCurrencyCode: { type: string }

    ExternalSortimentItem:
      type: object
      properties:
        ID: { type: string }
        Data: { type: string }
        Price: { type: integer, nullable: true }
        Tag: { type: string }
        Transferable: { type: boolean, nullable: true }
        Valid: { type: boolean, nullable: true }

    ParkingZone:
      type: object
      properties:
        ID: { type: string }
        Name: { type: string }
        Description: { type: string }
        QrID: { type: string }
        OpeningHours:
          type: array
          items: { $ref: '#/components/schemas/ParkingZoneOpeningHours' }

    ParkingZoneOpeningHours:
      type: object
      properties:
        DayOfWeek: { type: string }
        Begin: { type: string }
        End: { type: string }
        MinLen: { type: string }
        Intervals:
          type: array
          items: { $ref: '#/components/schemas/ParkingTariffInterval' }

    ParkingTariffInterval:
      type: object
      properties:
        Offset: { type: string }
        Len: { type: string }
        MinutePrice: { type: string }

    ProductSync:
      type: object
      description: One synchronised purchased product (offline ticket bundle).
      properties:
        ProductID: { type: string }
        ProductType: { type: string }
        Status: { type: string }
        Description: { type: string }
        Data: { type: string, description: 'Base64 product payload'}
        Signature: { type: string, description: 'Base64 signature over data'}
        ValidFrom: { type: string, nullable: true, description: 'yyyyMMddHHmm' }
        ValidTo: { type: string, nullable: true, description: 'yyyyMMddHHmm' }
        OverrunTo: { type: string, nullable: true, description: 'yyyyMMddHHmm' }
        WarningPeriod: { type: string, nullable: true }
        IsTransmitted: { type: boolean, nullable: true }
        VIS: { type: array, items: { $ref: '#/components/schemas/VIS' } }

    VIS:
      type: object
      description: Validate-on-station (VIS) record attached to a product.
      properties:
        ID: { type: string }
        S: { type: string }
        ValidFrom: { type: string }
        ValidTo: { type: string }

    TMapyGlobalListItemInfo:
      type: object
      description: Reference to a global list item (city, station, address…).
      properties:
        ListID: { type: integer, description: '1=CITY, 2=CITYPART, 3=STATIONSEXT, 8=ADDRESS, 9=STATIONS'}
        Item: { type: integer }
        Name: { type: string }

    TMapyTimetableObjectInfo:
      type: object
      description: A timetable object (station) with its routes.
      properties:
        Item: { $ref: '#/components/schemas/TMapyGlobalListItemInfo' }
        Name: { type: string }
        Type: { type: string }
        State: { type: string }
        Region: { type: string }
        Lines: { type: string }
        TrCategory: { type: string }
        StCount: { type: integer }
        TrTypeId: { type: array, items: { type: integer } }
        Stations: { type: array, items: { $ref: '#/components/schemas/TMapyStationInfo' } }

    TMapyStationInfo:
      type: object
      properties:
        Key: { type: integer, format: int64 }
        Name: { type: string }
        Station: { type: integer }
        ReservKey: { type: integer, format: int64 }
        InfoFile: { type: string }
        TrTypeId: { type: array, items: { type: integer } }

    TMapyFillConnectionPricesMessage:
      type: object
      properties:
        Handle: { type: integer }
        CombId: { type: string }
        ConnInfo: { $ref: '#/components/schemas/TMapyConnectionListInfo' }
        FromObjects: { type: array, items: { $ref: '#/components/schemas/TMapyTimetableObjectInfo' } }
        ToObjects: { type: array, items: { $ref: '#/components/schemas/TMapyTimetableObjectInfo' } }
        ViaObjects: { type: array, items: { $ref: '#/components/schemas/TMapyTimetableObjectInfo' } }
        ChangeObjects: { type: array, items: { $ref: '#/components/schemas/TMapyTimetableObjectInfo' } }

    TMapyConnectionListInfo:
      type: object
      properties:
        OrigCity: { type: string }
        DestCity: { type: string }
        AllowPrev: { type: boolean }
        AllowNext: { type: boolean }
        Connections: { type: array, items: { $ref: '#/components/schemas/TMapyConnectionInfo' } }

    TMapyConnectionInfo:
      type: object
      properties:
        Id: { type: integer }
        CombId: { type: string }
        TimeLength: { type: string }
        Distance: { type: string }
        TmData: { $ref: '#/components/schemas/TMapyConnectionData' }
        Trains: { type: array, items: { $ref: '#/components/schemas/TMapyConnectionTrainInfo' } }
        Remarks: { $ref: '#/components/schemas/TMapyRemarksInfo' }

    TMapyConnectionTrainInfo:
      type: object
      properties:
        From: { type: integer }
        To: { type: integer }
        DateTime1: { type: string }
        DateTime2: { type: string }
        TimeLength: { type: string }
        Distance: { type: string }
        Delay: { type: integer }
        LinkDist: { type: integer }
        TmData: { $ref: '#/components/schemas/TMapyConnectionTrainData' }
        TrainData: { $ref: '#/components/schemas/TMapyTrainDataInfo' }

    TMapyConnectionTrainData:
      type: object
      properties:
        Zones: { type: array, items: { type: string } }
        PriceList: { $ref: '#/components/schemas/TMapyPriceList' }

    TMapyTrainDataInfo:
      type: object
      properties:
        Info: { $ref: '#/components/schemas/TMapyTrainInfo' }
        Route: { type: array, items: { $ref: '#/components/schemas/TMapyTrainRouteInfo' } }
        Remarks: { $ref: '#/components/schemas/TMapyRemarksInfo' }

    TMapyTrainInfo:
      type: object
      properties:
        Id: { type: integer }
        Train: { type: integer }
        TtIndex: { type: integer }
        Type: { type: string }
        TypeName: { type: string }
        Num1: { type: string }
        Num2: { type: string }
        Color: { type: integer }
        Flags: { type: integer }
        Info: { type: string }

    TMapyTrainRouteInfo:
      type: object
      properties:
        Station: { $ref: '#/components/schemas/TMapyStationInfo' }
        ArrTime: { type: string }
        DepTime: { type: string }
        ArrCycle: { type: integer }
        DepCycle: { type: integer }
        Dist: { type: string }
        Flags: { type: integer }

    TMapyRemarksInfo:
      type: object
      properties:
        Remarks: { type: array, items: { $ref: '#/components/schemas/TMapyRemarkInfo' } }

    TMapyRemarkInfo:
      type: object
      properties:
        Type: { type: integer }
        Text: { type: string }

    TMapyConnectionData:
      type: object
      properties:
        Fare: { type: integer }
        ErrorCode: { type: integer }

    TMapyPriceList:
      type: object
      properties:
        AgeCategories: { type: array, items: { $ref: '#/components/schemas/TMapyAgeCategory' } }

    TMapyAgeCategory:
      type: object
      properties:
        Name: { type: string }
        Help1: { type: string }
        IsDefault: { type: boolean, nullable: true }
        DiscountClaims: { type: array, items: { $ref: '#/components/schemas/TMapyDiscountClaim' } }

    TMapyDiscountClaim:
      type: object
      description: Discount claim (sleva) attached to a CRWS ticket purchase.
      properties:
        default: { type: integer, description: 'customer profile code (JSON key is "default")'}
        Name: { type: string }
        Help2: { type: string }
        IsDefault: { type: boolean, nullable: true }
        Ticket: { $ref: '#/components/schemas/TMapyTicket' }

    TMapyTicket:
      type: object
      properties:
        SingleFare: { $ref: '#/components/schemas/TMapySingleFare' }

    TMapySingleFare:
      type: object
      properties:
        Fare: { type: number, nullable: true }
        FareLabel: { type: string }
        BicycleFare: { type: number, nullable: true }
        DogFare: { type: number, nullable: true }
        LuggageFare: { type: number, nullable: true }
        WorkDayLimit: { type: integer }
        OtherDayLimit: { type: integer }
        TraiffProfile: { type: integer, description: 'sic — typo is in the payload'}

    IDPTariffItem:
      type: object
      properties:
        UIDtarif: { type: integer }
        NazevTarifu: { type: string }
        IDCenik: { type: integer }
        ID_CP: { type: integer }
        ID_TP: { type: integer }
        Typ: { type: integer }
        NavaznaCP: { type: array, items: { type: integer } }
        NetworkID: { type: integer }
