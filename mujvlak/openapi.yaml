        sEmail: { type: string }
        sPhone: { type: string, nullable: true }
        dtDOB: { type: string, nullable: true }
        sCardNum: { type: string, nullable: true }
        iCardType: { type: integer, nullable: true }

    IpwsRefundCommand:
      type: object
      description: >
        Refund commands carry an `oRefundData` object (iRefundType, sTransCode,
