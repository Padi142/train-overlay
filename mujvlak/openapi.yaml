        ZonaDo: { type: integer, nullable: true }
        TrasaPopis: { type: string, nullable: true }
        PovoleneZonyCelkem: { type: array, items: { type: integer } }
        PovoleneZonyDoQR: { type: array, items: { type: integer } }

    IdpJIJTicketPurchaseInfo:
