    RefundProductInput:
      type: object
      required: [DeviceID, UserName, ProductID]
      properties:
        DeviceID: { type: string }
        UserName: { type: string }
        ProductID: { type: integer, format: int64 }

    # ------------------------------------------------------------------
    # IPWS shared
    # ------------------------------------------------------------------
    IpwsBaseEnvelope:
      type: object
      description: |
        Base fields added to every IPWS request body. Language codes:
        0=cs, 1=en, 2=de, 3=sk, 4=pl.
      properties:
        iLang:
          type: integer
          minimum: 0
          maximum: 4
          default: 0

    IpwsSessionEnvelope:
      allOf:
        - $ref: '#/components/schemas/IpwsBaseEnvelope'
        - type: object
          required: [sSessionID]
          properties:
            sSessionID: { type: string, description: 'Session id obtained from CreateSession'}

    IpwsCreateSessionRequest:
      allOf:
        - $ref: '#/components/schemas/IpwsBaseEnvelope'
        - type: object
          required: [sAppID]
          properties:
            sAppID:
              type: string
              description: >
                App GUID — the SERVER GATES ON THIS VALUE and only accepts the
                GUID of the currently published (v32) app:
                `{A6AB5B3E-8A7E-4E84-9DC8-801561CE886F}`. The older GUID
                compiled into app releases up to ~2.16.x,
                `{1532A12E-0D17-4B83-A9BB-8827EAD33F26}`, is rejected by a
                server-side client filter with error `10000 Neautorizovaný
                přístup.` before any login logic runs (verified live 2026-09).
                The GUID per server type is selected in IpwsUtils.getAppId().
            sUserDesc:
              type: string
              description: >
                Device fingerprint built by IpwsUtils.getUserDesc(), see schema
                IpwsUserDesc for the exact format.
            sUser: { type: string, nullable: true }
            sPwd: { type: string, nullable: true }
            sToken: { type: string, nullable: true, description: 'Firebase token'}
            iTokenType: { type: integer, description: '1 = Firebase'}
            oRegisterNotificationsSettings: { $ref: '#/components/schemas/IpwsRegisterNotificationsSettings' }

    IpwsUserDesc:
      type: string
      description: >
        Device fingerprint, pipe-separated, built by IpwsUtils.getUserDesc():
        `appVersionCode|sdkVersion|deviceModel|androidId^serial|installId|lang|country|densityDpi|widthPixels|heightPixels|versionName`.
        On SDK >= 29 androidId/serial are omitted but the '^' separator is always
        appended; installId is a random UUID generated on first app start
        (CommonDb.resetInstallId()).
        Example: `352|34|SM-S918B|^|8f14e45f-1234-5678-9abc-def012345678|cs|CZ|440|1080|2400|2.19.0`

    IpwsRegisterNotificationsSettings:
      type: object
      properties:
        iNotificationMask: { type: integer }
        iInitialAdvance: { type: integer }
        iChangeAdvance: { type: integer }
        iDelayLimit: { type: integer }
        iGetOffAdvance: { type: integer }

    IpwsDataResponse:
      type: object
      description: >
        Successful IPWS responses carry payload under `d` and optionally a server
        timestamp `t` (unix seconds). On failure the response instead contains
        `ExceptionType` + `Message` where Message = `"<code> <text>"`.
      properties:
        d:
          type: object
          additionalProperties: true
          description: Command-specific payload (partial for most commands — see description of each path)
        t: { type: integer, format: int64, description: 'server time, unix seconds'}
      additionalProperties: true

    IpwsSessionResponse:
      type: object
      properties:
        d:
          type: object
          properties:
            bTest: { type: boolean, description: 'true when connected to a test server' }
            sSessionID: { type: string }
            iLoginErr: { type: integer, description: '0 = logged in'}
            sLoginErr: { type: string, nullable: true }
            oLoginInfo:
              type: object
              nullable: true
              properties:
                sEmail: { type: string }
                sFirstName: { type: string, nullable: true }
                sSurname: { type: string, nullable: true }
                sTitleBefore: { type: string, nullable: true }
                sTitleAfter: { type: string, nullable: true }
                sPhone: { type: string, nullable: true }
                sAvatarUrl: { type: string, nullable: true }
        t: { type: integer, format: int64 }

    IpwsAgreementVersions:
      type: object
      properties:
        aiTypeIds: { type: array, items: { type: integer } }
        aiVersions: { type: array, items: { type: integer } }

    IpwsPlaceId:
      type: object
      description: Place reference (station key, city, address or coordinates).
      additionalProperties: true

    IpwsPlaceVia:
      type: object
      additionalProperties: true

    IpwsSearchConnectionParams:
      type: object
      properties:
        iSearchConnectionFlags: { type: integer }
        aiTrTypeID: { type: array, items: { type: integer } }
        iMaxChange: { type: integer, nullable: true }
        iMinTime: { type: integer, nullable: true }
        iUseBeds: { type: integer, nullable: true }
        iCarrier: { type: integer, nullable: true }

    IpwsPriceRequestClass:
      type: object
      properties:
        iClass: { type: integer, description: '1 = 1st, 2 = 2nd class'}
        bBusiness: { type: boolean }

    IpwsPriceRequestPassenger:
      type: object
      properties:
        iCount: { type: integer }
        iAge: { type: integer }
        oPassenger: { type: object, additionalProperties: true }

    IpwsPriceRequest:
