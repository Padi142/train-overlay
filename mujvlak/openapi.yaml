openapi: 3.0.3
info:
  title: Můj vlak (My Train) — Reverse-Engineered API
  version: 2.16.1 (build 332)
  description: |
    OpenAPI specification of the HTTP APIs used by the Android app
    **Můj vlak / My Train** (`cz.cd.mujvlak.an`, České dráhy, version 2.16.1),
    recovered by decompiling the APK with apktool 3.0.3 and jadx 1.5.6.

    The app talks to four distinct back-ends:

    | # | Back-end | Purpose | Base URL (production) |
    |---|----------|---------|----------------------|
    | A | **MapPhone Server** (`MapPhoneServerWS`, ODP/ČD) | User accounts, IN-Karta/ČD-kredit, ticket purchase & sync, parking, payment initiation | `https://mapphone.cd.cz/MapPhoneServerWS.svc/` |
    | B | **IPWS** (CHAPS/Circlegate "InterProduct WebService") | Timetable search (CRWS), e-shop buy process, user sessions, tickets, refunds, ČD Bike, SMS tickets | `https://ipws.cdis.cz` |
    | C | **CGWS** (Circlegate Android Service) | Offline timetable catalogue download, version checks | `https://cd-ws.circlegate.com/AndroidService.svc` |
    | D | **Circlegate support WS** | Problem/user-support report upload | `https://wsandroid.circlegate.com/ServiceContractV7.svc` |

    ### General notes
    * All four services exchange **JSON** (`Content-Type: application/json; charset=utf-8`).
    * MapPhone uses **PascalCase** JSON field names (Gson `@SerializedName`).
    * IPWS/CGWS use Hungarian-notation field names (`s…` string, `i…` int, `o…` object, `ao…` object array, `as…` string array, `b…` bool, `dt…` ISO date-time).
    * All clients are plain OkHttp; the IPWS/CGWS clients are built with a
      **trust-all SSL context** (certificate pinning is not used).
    * Schemas marked *(partial)* could not be fully reconstructed from the decompiled code.

    ### Error codes (observed live, 2026-09)
    IPWS business errors arrive as HTTP 500 + `{"ExceptionType": "", "Message": "<code> <text>"}`
    (the app treats HTTP 500 as a valid response — `IpwsCommon$IpwsParam.isResponseCodeAcceptable`).

    | Code | Message (cs) | Meaning |
    |------|--------------|---------|
    | 10000 | Neautorizovaný přístup. | **Client gate** — request rejected before login logic; observed when the `sAppID` GUID is not the currently-published app's GUID (old releases are blocked). Not a credentials problem. |
    | 10121 | Zadali jste nesprávný e-mail nebo heslo. | Wrong e-mail or password (normal business error from `Login1`). |

    Unknown/unimplemented commands return a plain HTTP 404; GET on a command
    endpoint returns 405 (only POST is accepted).

externalDocs:
  description: Decompiled source of the app (jadx output)
  url: https://github.com/ceskedrahy (see decompiled sources in jadx-out/sources)

servers:
  # ---- A: MapPhone Server (ČD) ----
  - url: https://mapphone.cd.cz/MapPhoneServerWS.svc/
    description: MapPhone production (used by release builds)
    x-server-id: mapphone
  - url: https://cma.odp.cz/mapphoneservercd/
    description: MapPhone test (AZAK2)
    x-server-id: mapphone-test
  - url: https://mapphone-test.cd.cz/MapPhoneServerWS.svc/
    description: MapPhone test (AZAK3)
    x-server-id: mapphone-test2
  # ---- B: IPWS ----
  - url: https://ipws.cdis.cz
    description: IPWS production (timetable + e-shop)
    x-server-id: ipws
  - url: https://ipws-test.cdis.cz
    description: IPWS test
    x-server-id: ipws-test
  - url: https://ipws.timetable.cz
    description: IPWS test (AZAK2)
    x-server-id: ipws-tt
  - url: https://ipwsv16.chaps.cz
  - url: https://ipwsv32.chaps.cz
  - url: https://ipwsv32-2.chaps.cz
  - url: https://ipwsv32prod.chaps.cz:10432
    description: Internal production v32
  # ---- C: CGWS ----
  - url: https://cd-ws.circlegate.com/AndroidService.svc
    x-server-id: cgws
  # ---- D: support WS ----
  - url: https://wsandroid.circlegate.com/ServiceContractV7.svc
    x-server-id: support

tags:
  - name: MapPhone – Account & Devices
    description: Registration, account binding, PIN, account deletion, push registration.
  - name: MapPhone – Identity Pack (IN-Karta)
    description: Digital identity pack / photo / IN-Karta info.
  - name: MapPhone – Catalogue & Products
    description: Sortiment (product catalogue), journey profiles, parking info.
  - name: MapPhone – Journey & Tickets
    description: Journey computation, CRWS connection search, ticket purchase.
  - name: MapPhone – Payment
    description: Payment via CSOB gateway / Masterpass / ODIS / IDP.
  - name: MapPhone – Sync
    description: Product (ticket) synchronisation and support endpoints.
  - name: IPWS – Session & Login
    description: IPWS session lifecycle and user login/registration.
  - name: IPWS – Journeys
    description: Timetable connection search and detail.
  - name: IPWS – Stations & Trains
    description: Station and train info.
  - name: IPWS – Buy Process
    description: Ticket purchase session (price offers, passengers, extras, seat reservation).
  - name: IPWS – Payments & Refunds
    description: Common payment flow and ticket refunds.
  - name: IPWS – Tickets
    description: Ticket synchronisation, shared/SMS tickets, activations.
  - name: IPWS – IN-Karta
    description: IN-Karta pairing and ČD-kredit / commuter ticket products.
  - name: IPWS – Notifications
    description: Push registration for train/connection notifications.
  - name: IPWS – Misc
    description: Side-buy, ČD Bike, NaKlik cards, agreements, customer satisfaction…
  - name: CGWS
    description: Circlegate AndroidService (offline timetable, version check).
  - name: Support WS
    description: Problem report upload.

paths:
  # =====================================================================
  # A) MapPhoneServerWS  (paths are relative to .../MapPhoneServerWS.svc/)
  # =====================================================================

  /ping:
    get:
      tags: [MapPhone – Sync]
      summary: Liveness check
      operationId: ping
      responses:
        '200':
          description: Server is reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapPhoneStatusResult'

  /mobileAppVersions:
    get:
      tags: [MapPhone – Sync]
      summary: Minimum/recommended app versions per platform
      operationId: mobileAppVersions
      responses:
        '200':
          description: Version catalogue
          content:
            application/json:
              schema:
                type: object
                properties:
                  Status: { $ref: '#/components/schemas/MapPhoneStatus' }
                  Versions:
                    type: array
                    items: { $ref: '#/components/schemas/MobileAppVersion' }

  /bindAccount:
    post:
      tags: [MapPhone – Account & Devices]
      summary: Bind (login) an existing account to this device — returns account public key
      operationId: bindAccount
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BindAccountInput' } } }
      responses:
        '200':
          description: Bind result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BindAccountResult'

  /newAccount:
    post:
      tags: [MapPhone – Account & Devices]
      summary: Register a new (not yet confirmed) account; a confirmation e-mail is sent
      operationId: newAccount
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/NewAccountInput' } } }
      responses:
        '200':
          description: Status
          content: { application/json: { schema: { $ref: '#/components/schemas/MapPhoneStatusResult' } } }

  /confirmAccount:
    post:
      tags: [MapPhone – Account & Devices]
      summary: Confirm account registration with the code from the confirmation e-mail
      operationId: confirmAccount
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ConfirmAccountInput' } } }
      responses:
        '200':
          description: Status
          content: { application/json: { schema: { $ref: '#/components/schemas/MapPhoneStatusResult' } } }

  /newConfirmedAccount:
    post:
      tags: [MapPhone – Account & Devices]
      summary: Create a fully-confirmed account directly (with identity pack data)
      operationId: newConfirmedAccount
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/NewConfirmedAccountInput' } } }
      responses:
        '200':
          description: Created account info
          content:
            application/json:
              schema:
                type: object
                properties:
                  Status: { $ref: '#/components/schemas/MapPhoneStatus' }
                  PublicKeyXML: { type: string, description: 'XML-encoded RSA public key for offline ticket signing'}
                  UserName: { type: string }
                  Email: { type: string }
                  EndOfValidity: { type: string, description: 'yyyy-MM-dd or yyyyMMdd' }

  /deleteAccount:
    post:
      tags: [MapPhone – Account & Devices]
      summary: Delete account bound to this device (requires PIN)
      operationId: deleteAccount
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DeleteAccountInput' } } }
      responses:
        '200':
          description: Status
          content: { application/json: { schema: { $ref: '#/components/schemas/MapPhoneStatusResult' } } }

  /changePIN:
    post:
      tags: [MapPhone – Account & Devices]
      summary: Change account PIN
      operationId: changePIN
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ChangePINInput' } } }
      responses:
        '200':
          description: Status
          content: { application/json: { schema: { $ref: '#/components/schemas/MapPhoneStatusResult' } } }

  /forgottenPIN:
    post:
      tags: [MapPhone – Account & Devices]
      summary: Reset forgotten PIN (delivery method chosen via `User`/`Password` params)
      operationId: forgottenPIN
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ForgottenPINInput' } } }
      responses:
        '200':
          description: Status
          content: { application/json: { schema: { $ref: '#/components/schemas/MapPhoneStatusResult' } } }

  /updatePushDeviceId:
    post:
      tags: [MapPhone – Account & Devices]
      summary: Register FCM push token for the account
      operationId: updatePushDeviceId
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdatePushDeviceIdInput' } } }
      responses:
        '200':
          description: Status
          content: { application/json: { schema: { $ref: '#/components/schemas/MapPhoneStatusResult' } } }

  /idsokCreateUser:
    post:
      tags: [MapPhone – Account & Devices]
      summary: Create user in IDSOK (integrated IdS OK system, e.g. regional operator)
      operationId: idsokCreateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [Email, UserPassword]
              properties:
                Email: { type: string }
                UserPassword: { type: string }
      responses:
        '200':
          description: Status
          content: { application/json: { schema: { $ref: '#/components/schemas/MapPhoneStatusResult' } } }

  /idsokBindExisting:
    post:
      tags: [MapPhone – Account & Devices]
      summary: Bind existing IDSOK account via token
      operationId: idsokBindExisting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                DeviceID: { type: string }
                DeviceInfo: { type: string }
                Email: { type: string }
                PhoneName: { type: string }
                PIN: { type: string }
                PushDeviceID: { type: string }
                Token: { type: string }
      responses:
        '200':
          description: Bind result
          content:
            application/json:
              schema:
                type: object
                properties:
                  Status: { $ref: '#/components/schemas/MapPhoneStatus' }
                  PublicKeyXML: { type: string }
                  UserName: { type: string }

  /idsokDeleteAccount:
    post:
      tags: [MapPhone – Account & Devices]
      summary: Delete IDSOK account
      operationId: idsokDeleteAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevicePinAccountInput'
      responses:
        '200':
          description: Status
          content: { application/json: { schema: { $ref: '#/components/schemas/MapPhoneStatusResult' } } }

  /ikBindExisting:
    post:
      tags: [MapPhone – Account & Devices]
      summary: Bind existing IN-Karta (card number + password) to the device
      operationId: ikBindExisting
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IkBindExistingInput' } } }
      responses:
        '200':
          description: Bind result
          content: { application/json: { schema: { $ref: '#/components/schemas/BindAccountResult' } } }

  /ikGetInfo:
    post:
      tags: [MapPhone – Account & Devices]
      summary: Query IN-Karta capabilities (discounts available on the card)
      operationId: ikGetInfo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [DeviceID, IDK]
              properties:
                DeviceID: { type: string }
                IDK: { type: string, description: 'IN-Karta card number'}
      responses:
        '200':
          description: Card capabilities
          content:
            application/json:
              schema:
                type: object
                properties:
                  Status: { $ref: '#/components/schemas/MapPhoneStatus' }
                  HasEP: { type: boolean, description: "e-peněženka (e-wallet) present" }
                  HasISIC: { type: boolean, description: 'ISIC card present'}
                  HasZP: { type: boolean, description: "zákaznický program (loyalty) present" }
                  TransferToVIKAllowed: { type: boolean }

  /odisBindExisting:
    post:
      tags: [MapPhone – Account & Devices]
      summary: Bind existing ODIS (IDSK/MHD) account via user token
      operationId: odisBindExisting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                DeviceID: { type: string }
                DeviceInfo: { type: string }
                PushDeviceID: { type: string }
                UserToken: { type: string }
      responses:
        '200':
          description: Bind result
          content:
            application/json:
              schema:
                type: object
                properties:
                  Status: { $ref: '#/components/schemas/MapPhoneStatus' }
                  PublicKeyXML: { type: string }

  /pmdpBindExisting:
    post:
      tags: [MapPhone – Account & Devices]
      summary: Bind existing "PMDP" (Plzeň PMDP) account — returns OAuth-like tokens
      operationId: pmdpBindExisting
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PmdpBindExistingInput' } } }
      responses:
        '200':
          description: Bind result
          content: { application/json: { schema: { $ref: '#/components/schemas/PmdpBindExistingResult' } } }

  /pmdpRefreshAccessToken:
    post:
      tags: [MapPhone – Account & Devices]
      summary: Refresh PMDP access token
      operationId: pmdpRefreshAccessToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [UserName, RefreshToken]
              properties:
                UserName: { type: string }
                RefreshToken: { type: string }
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema:
                type: object
                properties:
                  Status: { $ref: '#/components/schemas/MapPhoneStatus' }
                  AccessToken: { type: string }
                  RefreshToken: { type: string }

  # ---------------- Identity Pack ----------------

  /setIdentityPack:
    post:
      tags: [MapPhone – Identity Pack (IN-Karta)]
      summary: Upload/replace the identity pack (photo + holder data)
      operationId: setIdentityPack
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SetIdentityPackInput' } } }
      responses:
        '200':
          description: Status
          content: { application/json: { schema: { $ref: '#/components/schemas/MapPhoneStatusResult' } } }

  /compressPhoto:
    post:
      tags: [MapPhone – Identity Pack (IN-Karta)]
      summary: Server-side downscale of a base64 JPEG photo
      operationId: compressPhoto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [PhotoHQ]
              properties:
                PhotoHQ: { type: string, description: 'Base64-encoded high-quality photo'}
      responses:
        '200':
          description: Compressed photo
          content:
            application/json:
              schema:
                type: object
                properties:
                  Status: { $ref: '#/components/schemas/MapPhoneStatus' }
                  PhotoLQ: { type: string, description: 'Base64-encoded low-quality photo'}

  /resendIdentityPackCard:
    post:
      tags: [MapPhone – Identity Pack (IN-Karta)]
      summary: Re-send (re-download) the identity-pack card
      operationId: resendIdentityPackCard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [DeviceID, UserName]
              properties:
                DeviceID: { type: string }
                UserName: { type: string }
      responses:
        '200':
          description: Status
          content: { application/json: { schema: { $ref: '#/components/schemas/MapPhoneStatusResult' } } }

  # ---------------- Catalogue ----------------

  /getSortiment:
    post:
      tags: [MapPhone – Catalogue & Products]
      summary: Product catalogue (ticket templates grouped by category)
      operationId: getSortiment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [DeviceID]
              properties:
                DeviceID: { type: string }
                Tags: { type: array, items: { type: string } }
      responses:
        '200':
          description: Catalogue groups
          content:
            application/json:
              schema:
                type: object
                properties:
                  Status: { $ref: '#/components/schemas/MapPhoneStatus' }
                  Groups:
                    type: array
                    items: { $ref: '#/components/schemas/SortimentGroup' }

  /getExternalSortiment:
    post:
      tags: [MapPhone – Catalogue & Products]
      summary: "External products (third-party tickets by tag)"
      operationId: getExternalSortiment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [DeviceID]
              properties:
                DeviceID: { type: string }
                Tags: { type: array, items: { type: string } }
      responses:
        '200':
          description: Items
          content:
            application/json:
              schema:
                type: object
                properties:
                  Status: { $ref: '#/components/schemas/MapPhoneStatus' }
                  Items:
                    type: array
                    items: { $ref: '#/components/schemas/ExternalSortimentItem' }

  /supportedPaymentMethods:
    post:
      tags: [MapPhone – Payment]
      summary: Payment methods supported for the user
      operationId: supportedPaymentMethods
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                DeviceID: { type: string }
                Username: { type: string }
      responses:
        '200':
          description: Method codes
          content:
            application/json:
              schema:
                type: object
                properties:
                  Status: { $ref: '#/components/schemas/MapPhoneStatus' }
                  Methods: { type: array, items: { type: string } }

  /supportedRozcestnik:
    post:
      tags: [MapPhone – Catalogue & Products]
      summary: "Rozcestník (integrated-ticket gateway) items supported for the user"
      operationId: supportedRozcestnik
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                DeviceID: { type: string }
                Username: { type: string }
      responses:
        '200':
          description: Item codes
          content:
            application/json:
              schema:
                type: object
                properties:
                  Status: { $ref: '#/components/schemas/MapPhoneStatus' }
                  Items: { type: array, items: { type: string } }

  /getParkingInfo:
    post:
      tags: [MapPhone – Catalogue & Products]
      summary: Parking zones, opening hours and tariff intervals (P+R)
      operationId: getParkingInfo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [DeviceID]
              properties:
                DeviceID: { type: string }
      responses:
        '200':
          description: Parking zones
          content:
            application/json:
              schema:
                type: object
                properties:
                  Status: { $ref: '#/components/schemas/MapPhoneStatus' }
                  Zones:
                    type: array
                    items: { $ref: '#/components/schemas/ParkingZone' }

  /getJourneyProfiles:
    post:
      tags: [MapPhone – Journey & Tickets]
      summary: Journey (kilometric ticket) price profiles
      operationId: getJourneyProfiles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [DeviceID]
              properties:
                DeviceID: { type: string }
      responses:
        '200':
          description: Profiles
          content:
            application/json:
              schema:
                type: object
                properties:
                  Status: { $ref: '#/components/schemas/MapPhoneStatus' }
                  Profiles:
                    type: array
                    items: { $ref: '#/components/schemas/JourneyProfileItem' }

  # ---------------- Journeys & CRWS ----------------

  /findJourneyStations:
    post:
      tags: [MapPhone – Journey & Tickets]
      summary: Station autocomplete for kilometric tickets
      operationId: findJourneyStations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [DeviceID, SearchInput]
              properties:
                DeviceID: { type: string }
                SearchInput: { type: string }
      responses:
        '200':
          description: Stations
          content:
            application/json:
              schema:
                type: object
                properties:
                  Status: { $ref: '#/components/schemas/MapPhoneStatus' }
                  Stations:
                    type: array
                    items: { $ref: '#/components/schemas/JourneyStationItem' }

  /computeJourney:
    post:
      tags: [MapPhone – Journey & Tickets]
      summary: Compute price for a kilometric (profile-based) journey
      operationId: computeJourney
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ComputeJourneyInput' } } }
      responses:
        '200':
          description: Computed journey
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComputeJourneyResult' }

  /newJourneyTicket:
    post:
      tags: [MapPhone – Journey & Tickets]
      summary: Create (buy) a kilometric journey ticket — returns transaction id
      operationId: newJourneyTicket
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/NewJourneyTicketInput' } } }
      responses:
        '200':
          description: Transaction
          content:
            application/json:
              schema:
                type: object
                properties:
                  Status: { $ref: '#/components/schemas/MapPhoneStatus' }
                  TransactionID: { type: string }

  /findCrwsJourneyStations:
    post:
      tags: [MapPhone – Journey & Tickets]
      summary: Station/timetable-object autocomplete for CRWS connections
      operationId: findCrwsJourneyStations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [DeviceID, SearchInput]
              properties:
                DeviceID: { type: string }
                SearchInput: { type: string }
      responses:
        '200':
          description: Timetable objects
          content:
            application/json:
              schema:
                type: object
                properties:
                  Status: { $ref: '#/components/schemas/MapPhoneStatus' }
                  Stations:
                    type: array
                    items: { $ref: '#/components/schemas/TMapyTimetableObjectInfo' }

  /searchCrwsConnections:
    post:
      tags: [MapPhone – Journey & Tickets]
      summary: Search CRWS connections and fill prices (IDOS-like)
      operationId: searchCrwsConnections
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SearchCrwsConnectionsInput' } } }
      responses:
        '200':
          description: Connection page
          content:
            application/json:
              schema:
                type: object
                properties:
                  Status: { $ref: '#/components/schemas/MapPhoneStatus' }
                  Result: { $ref: '#/components/schemas/TMapyFillConnectionPricesMessage' }

  /crwsGetConnectionPage:
    post:
      tags: [MapPhone – Journey & Tickets]
      summary: Paging over CRWS search results
      operationId: crwsGetConnectionPage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [HandleID, PrevConn, ConnID, CombID]
              properties:
                HandleID: { type: integer, description: 'Search handle'}
                PrevConn: { type: boolean }
                ConnID: { type: integer }
                CombID: { type: string }
      responses:
        '200':
          description: Connection list
          content:
            application/json:
              schema:
                type: object
                properties:
                  Status: { $ref: '#/components/schemas/MapPhoneStatus' }
                  Result: { $ref: '#/components/schemas/TMapyConnectionListInfo' }

  /newCrwsJourneyTicket:
    post:
      tags: [MapPhone – Journey & Tickets]
      summary: Buy a CRWS single ticket for a found connection
      operationId: newCrwsJourneyTicket
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/NewCrwsJourneyTicketInput' } } }
      responses:
        '200':
          description: Transaction
          content:
            application/json:
              schema:
                type: object
                properties:
                  Status: { $ref: '#/components/schemas/MapPhoneStatus' }
                  TransactionID: { type: string }

  # ---------------- IDP (integrated/regional tickets) ----------------

  /idpSearchStations:
    post:
      tags: [MapPhone – Journey & Tickets]
      summary: Search IDP stops (integrated transport zones)
      operationId: idpSearchStations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [DeviceID, Pattern, ZoneType, Limit]
              properties:
                DeviceID: { type: string }
                Pattern: { type: string }
                ZoneType: { type: integer }
                Limit: { type: integer }
      responses:
        '200':
          description: Stops (see IDPStationItem)
          content:
            application/json:
              schema:
                type: object
                properties:
                  Status: { $ref: '#/components/schemas/MapPhoneStatus' }
                  Result: { $ref: '#/components/schemas/IdpSearchStationsResultValue' }

  /idpGetTariffs:
    post:
      tags: [MapPhone – Journey & Tickets]
      summary: IDP tariff list for a zone type / tariff provider
      operationId: idpGetTariffs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [DeviceID, Typ, TP]
              properties:
                DeviceID: { type: string }
                Typ: { type: integer }
                TP: { type: integer }
      responses:
        '200':
          description: Tariffs
          content:
            application/json:
              schema:
                type: object
                properties:
                  Status: { $ref: '#/components/schemas/MapPhoneStatus' }
                  Result:
                    type: object
                    properties:
                      Items: { type: array, items: { $ref: '#/components/schemas/IDPTariffItem' } }

  /idpGetZona2Zona:
    post:
      tags: [MapPhone – Journey & Tickets]
      summary: Zone-to-zone fare options
      operationId: idpGetZona2Zona
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [DeviceID, IDZonaFrom, IDZonaTo]
              properties:
                DeviceID: { type: string }
                IDZonaFrom: { type: integer }
                IDZonaTo: { type: integer }
      responses:
        '200':
          description: Zone options
          content:
            application/json:
              schema:
                type: object
                properties:
                  Status: { $ref: '#/components/schemas/MapPhoneStatus' }
                  Result:
                    type: object
                    properties:
                      Items: { type: array, items: { $ref: '#/components/schemas/IDPZona2ZonaItem' } }

  /idpComputeJIJFare:
    post:
      tags: [MapPhone – Journey & Tickets]
      summary: Compute JIJ (jump-on-jump-off / time-ticket) fare
      operationId: idpComputeJIJFare
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [DeviceID, PurchaseInfo]
              properties:
                DeviceID: { type: string }
                PurchaseInfo: { $ref: '#/components/schemas/IdpJIJTicketPurchaseInfo' }
      responses:
        '200':
          description: Fare result
          content:
            application/json:
              schema:
                type: object
                properties:
                  Status: { $ref: '#/components/schemas/MapPhoneStatus' }
                  Result: { $ref: '#/components/schemas/IdpComputeJIJFareValue' }

  /idpNewJIJTicket:
    post:
      tags: [MapPhone – Journey & Tickets]
      summary: Buy JIJ ticket
      operationId: idpNewJIJTicket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [DeviceID, PurchaseInfo, PaymentInfo]
              properties:
                DeviceID: { type: string }
                PurchaseInfo: { $ref: '#/components/schemas/IdpJIJTicketPurchaseInfo' }
                PaymentInfo: { $ref: '#/components/schemas/PaymentInfo' }
      responses:
        '200':
          description: Payment redirect info
          content:
            application/json:
              schema:
                type: object
                properties:
                  Status: { $ref: '#/components/schemas/MapPhoneStatus' }
                  PaymentResultInfo: { $ref: '#/components/schemas/PaymentResultInfo' }

  # ---------------- Purchase / payment (MapPhone) ----------------

  /newProductViaMasterPass:
    post:
      tags: [MapPhone – Payment]
      summary: Buy catalogue product, paid via Masterpass
      operationId: newProductViaMasterPass
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [DeviceID, ProductTemplateID, PaymentInfo]
              properties:
                DeviceID: { type: string }
                ProductTemplateID: { type: string }
                PaymentInfo: { $ref: '#/components/schemas/PaymentInfo' }
      responses:
        '200':
          description: Payment redirect info
          content:
            application/json:
              schema:
                type: object
                properties:
                  Status: { $ref: '#/components/schemas/MapPhoneStatus' }
                  PaymentResultInfo: { $ref: '#/components/schemas/PaymentResultInfo' }

  /newExternalProduct:
    post:
      tags: [MapPhone – Payment]
      summary: Buy external product by template id
      operationId: newExternalProduct
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/NewExternalProductInput' } } }
      responses:
        '200':
          description: Payment redirect info
          content:
            application/json:
              schema:
                type: object
                properties:
                  Status: { $ref: '#/components/schemas/MapPhoneStatus' }
                  PaymentResultInfo: { $ref: '#/components/schemas/PaymentResultInfo' }

  /odisNewProduct:
    post:
      tags: [MapPhone – Payment]
      summary: Buy an ODIS product (product defined by JSON blob from ODIS app)
      operationId: odisNewProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [DeviceID, UserToken, ProductJSON, PaymentInfo]
              properties:
                DeviceID: { type: string }
                UserToken: { type: string }
                ProductJSON: { type: string, description: 'ODIS product definition JSON'}
                PaymentInfo: { $ref: '#/components/schemas/PaymentInfo' }
      responses:
        '200':
          description: Payment redirect info
          content:
            application/json:
              schema:
                type: object
                properties:
                  Status: { $ref: '#/components/schemas/MapPhoneStatus' }
                  PaymentResultInfo: { $ref: '#/components/schemas/PaymentResultInfo' }

  /newParkingViaMasterpass:
    post:
      tags: [MapPhone – Payment]
      summary: Pay for a parking session via Masterpass
      operationId: newParkingViaMasterpass
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/NewParkingViaMasterpassInput' } } }
      responses:
        '200':
          description: Transaction
          content:
            application/json:
              schema:
                type: object
                properties:
                  Status: { $ref: '#/components/schemas/MapPhoneStatus' }
                  TransactionID: { type: string }

  /refundProduct:
    post:
      tags: [MapPhone – Payment]
      summary: Cancel/refund a purchased product
      operationId: refundProduct
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RefundProductInput' } } }
      responses:
        '200':
          description: Refund result
          content:
            application/json:
              schema:
                type: object
                properties:
                  Status: { $ref: '#/components/schemas/MapPhoneStatus' }
                  ErrorMessage: { type: string, nullable: true }
                  Method: { type: string, nullable: true, description: 'Refund method (e.g. back to card / CD-kredit)'}

  # ---------------- Sync & misc ----------------

  /syncProducts:
    post:
      tags: [MapPhone – Sync]
      summary: >
        Incremental synchronisation of purchased products (offline tickets).
        Returns signed product blobs, identity pack and VIS records.
      operationId: syncProducts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [DeviceID, UserName, QRVersion]
              properties:
                DeviceID: { type: string }
                UserName: { type: string }
                Timestamp:
                  type: string
                  nullable: true
                  description: 'Last sync time, format yyyyMMddHHmmss'
                Tags: { type: array, items: { type: string } }
                QRVersion: { type: integer }
      responses:
        '200':
          description: Sync result
          content:
            application/json:
              schema:
                type: object
                properties:
                  Status: { $ref: '#/components/schemas/MapPhoneStatus' }
                  Timestamp: { type: string, description: 'yyyyMMddHHmmss' }
                  Email: { type: string, nullable: true }
                  IdentityPack: { type: string, nullable: true, description: 'Base64-encoded identity pack'}
                  PhotoHQ: { type: string, nullable: true, description: 'Base64 photo'}
                  ConfirmationMessage: { type: string, nullable: true }
                  ConfirmationWhen: { type: string, nullable: true, description: 'yyyyMMddHHmmss' }
                  AdditionalInfo: { type: string, nullable: true }
                  Products:
                    type: array
                    items: { $ref: '#/components/schemas/ProductSync' }


  # =====================================================================
  # B) IPWS — every call is POST {baseUrl}/IP.svc/{Command}
  # =====================================================================

  /IP.svc/CreateSession:
    post:
      tags: [IPWS – Session & Login]
      summary: Create IPWS session (auto-called when sSessionID missing; also logs the user in)
      operationId: ipwsCreateSession
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IpwsCreateSessionRequest' }
      responses:
        '200':
          description: 'Session info (envelope "{d: …}")'
          content: { application/json: { schema: { $ref: '#/components/schemas/IpwsSessionResponse' } } }

  /IP.svc/Login:
    post:
      tags: [IPWS – Session & Login]
      summary: Login with credentials (legacy)
      operationId: ipwsLogin
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IpwsSessionEnvelope' } } }
      responses:
        '200': { description: Result, content: { application/json: { schema: { $ref: '#/components/schemas/IpwsDataResponse' } } } }

  /IP.svc/Login1:
    post:
      tags: [IPWS – Session & Login]
      summary: >
        Login with e-mail + password; reports accepted agreement versions.
        This is the app's standard login: call CreateSession anonymously first
        (sUser="", sPwd=""), then authenticate with Login1 on the returned
        sSessionID (LoginActivity.executeTask "TASK_LOGIN").
      operationId: ipwsLogin1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/IpwsSessionEnvelope'
                - type: object
                  properties:
                    sUser: { type: string, description: 'e-mail'}
                    sPwd: { type: string }
                    sUserDesc: { $ref: '#/components/schemas/IpwsUserDesc' }
                    oAgreementVersions: { $ref: '#/components/schemas/IpwsAgreementVersions' }
      responses:
        '200':
          description: |
            User account detail (envelope `{d: …}`). On wrong credentials the
            server responds HTTP 500 with error `10121 Zadali jste nesprávný
            e-mail nebo heslo.` ("you entered a wrong e-mail or password").

  /IP.svc/Register:
    post:
      tags: [IPWS – Session & Login]
      summary: Register a new user account (e-mail, name, surname)
      operationId: ipwsRegister
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/IpwsBaseEnvelope'
                - type: object
                  properties:
                    oRegistrationInfo:
                      type: object
                      properties:
                        sEmail: { type: string }
                        sFirstName: { type: string }
                        sSurname: { type: string }
      responses:
        '200': { description: Result, content: { application/json: { schema: { $ref: '#/components/schemas/IpwsDataResponse' } } } }

  /IP.svc/Logoff:
    post:
      tags: [IPWS – Session & Login]
      summary: End session / log off user
      operationId: ipwsLogoff
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IpwsSessionEnvelope' } } }
      responses:
        '200': { description: Result, content: { application/json: { schema: { $ref: '#/components/schemas/IpwsDataResponse' } } } }

  /IP.svc/GetUserAccountDetail:
    post:
      tags: [IPWS – Session & Login]
      summary: Full user account detail (login info, IN-Karta list, agreements, avatar)
      operationId: ipwsGetUserAccountDetail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/IpwsSessionEnvelope'
                - type: object
                  properties:
                    sAvatarUrl: { type: string }
                    oAgreementVersions: { $ref: '#/components/schemas/IpwsAgreementVersions' }
      responses:
        '200': { description: Account detail, content: { application/json: { schema: { $ref: '#/components/schemas/IpwsDataResponse' } } } }

  /IP.svc/ResetPassword:
    post:
      tags: [IPWS – Session & Login]
      summary: Request password reset
      operationId: ipwsResetPassword
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/IpwsSessionEnvelope' } } } }
      responses:
        '200': { description: Result, content: { application/json: { schema: { $ref: '#/components/schemas/IpwsDataResponse' } } } }

  /IP.svc/SearchConnectionInfo1:
    post:
      tags: [IPWS – Journeys]
      summary: Search connections (main timetable query)
      operationId: ipwsSearchConnectionInfo1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/IpwsBaseEnvelope'
                - type: object
                  properties:
                    oFrom: { $ref: '#/components/schemas/IpwsPlaceId' }
                    oTo: { $ref: '#/components/schemas/IpwsPlaceId' }
                    aoVia: { type: array, items: { $ref: '#/components/schemas/IpwsPlaceVia' } }
                    aoChange: { type: array, items: { $ref: '#/components/schemas/IpwsPlaceVia' } }
                    dtDateTime: { type: string, format: date-time }
                    bIsDep: { type: boolean, description: 'true = departure time, false = arrival' }
                    iMaxCount: { type: integer }
                    iMaxObjectsCount: { type: integer }
                    oConnParms: { $ref: '#/components/schemas/IpwsSearchConnectionParams' }
                    oPriceRequestClass: { $ref: '#/components/schemas/IpwsPriceRequestClass' }
                    aoPassengers: { type: array, items: { $ref: '#/components/schemas/IpwsPriceRequestPassenger' } }
                    oPriceRequest: { $ref: '#/components/schemas/IpwsPriceRequest' }
      responses:
        '200':
          description: Connection list
          content:
            application/json:
              schema:
                type: object
                properties:
                  d:
                    type: object
                    properties:
                      aoConnections: { type: array, items: { $ref: '#/components/schemas/IpwsConnectionInfo' } }
                      bAllowNext: { type: boolean }
                      bAllowPrev: { type: boolean }

  /IP.svc/GetConnectionsPage:
    post:
      tags: [IPWS – Journeys]
      summary: Previous/next page of connection search results
      operationId: ipwsGetConnectionsPage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/IpwsSessionEnvelope'
                - type: object
                  properties:
                    iHandle: { type: integer }
                    iConnID: { type: integer }
                    bPrevConn: { type: boolean }
                    iListedConnCount: { type: integer }
                    iMaxCount: { type: integer }
                    iSearchConnectionFlags: { type: integer }
                    dtFromDepartLowerBound: { type: string, nullable: true }
                    dtFromDepartUpperBound: { type: string, nullable: true }
                    dtToArriveUpperBound: { type: string, nullable: true }
      responses:
        '200':
          description: Connection page
          content:
            application/json:
              schema:
                type: object
                properties:
                  d: { $ref: '#/components/schemas/IpwsConnectionList' }

  /IP.svc/EditConnection:
    post:
      tags: [IPWS – Journeys]
      summary: Detail of one journey (train sequence) from a result set
      operationId: ipwsEditConnection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/IpwsSessionEnvelope'
                - type: object
                  properties:
                    oConnParms: { $ref: '#/components/schemas/IpwsPlaceId' }
                    sDesc: { type: string }
                    oFrom: { $ref: '#/components/schemas/IpwsPlaceId' }
                    oTo: { $ref: '#/components/schemas/IpwsPlaceId' }
                    aoVia: { type: array, items: { $ref: '#/components/schemas/IpwsPlaceVia' } }
                    aoChange: { type: array, items: { $ref: '#/components/schemas/IpwsPlaceVia' } }
                    iTrainIndex: { type: integer }
                    bNext: { type: boolean }
                    oPriceRequest: { $ref: '#/components/schemas/IpwsPriceRequest' }
      responses:
        '200': { description: Journey detail, content: { application/json: { schema: { $ref: '#/components/schemas/IpwsDataResponse' } } } }

  /IP.svc/GetConnection:
    post:
      tags: [IPWS – Journeys]
      summary: Get one connection (by id/handle) incl. optional price request
      operationId: ipwsGetConnection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/IpwsSessionEnvelope'
                - type: object
                  properties:
                    iConnID: { type: integer }
                    iHandle: { type: integer }
                    oPriceRequest: { $ref: '#/components/schemas/IpwsPriceRequest' }
      responses:
        '200': { description: Connection, content: { application/json: { schema: { $ref: '#/components/schemas/IpwsDataResponse' } } } }

  /IP.svc/GetConnectionsPrice:
    post:
      tags: [IPWS – Journeys]
      summary: Batch price computation for connections
      operationId: ipwsGetConnectionsPrice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/IpwsSessionEnvelope'
                - type: object
                  properties:
                    aiConnID: { type: array, items: { type: integer } }
                    iHandle: { type: integer }
                    bStopIfAgeError: { type: boolean }
                    oPriceRequest: { $ref: '#/components/schemas/IpwsPriceRequest' }
      responses:
        '200': { description: Prices, content: { application/json: { schema: { $ref: '#/components/schemas/IpwsDataResponse' } } } }

  /IP.svc/MapConnectionAuxDesc:
    post:
      tags: [IPWS – Journeys]
      summary: Map auxiliary connection by description
      operationId: ipwsMapConnectionAuxDesc
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/IpwsSessionEnvelope'
                - type: object
                  properties:
                    sDesc: { type: string }
                    oPriceRequest: { $ref: '#/components/schemas/IpwsPriceRequest' }
      responses:
        '200': { description: Result, content: { application/json: { schema: { $ref: '#/components/schemas/IpwsDataResponse' } } } }

  /IP.svc/MapRequestedConnection:
    post:
      tags: [IPWS – Journeys]
      summary: Map a saved/requested connection by its id
      operationId: ipwsMapRequestedConnection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/IpwsSessionEnvelope'
                - type: object
                  properties:
                    sRcId: { type: string }
                    oPriceRequest: { $ref: '#/components/schemas/IpwsPriceRequest' }
      responses:
        '200': { description: Connection, content: { application/json: { schema: { $ref: '#/components/schemas/IpwsDataResponse' } } } }

  /IP.svc/RegisterRequestedConnection:
    post:
      tags: [IPWS – Journeys]
      summary: Create a request for a "required connection" (e.g. for compensations)
      operationId: ipwsRegisterRequestedConnection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/IpwsSessionEnvelope'
                - type: object
                  properties:
                    sDesc: { type: string }
                    iTrainIndex: { type: integer }
                    iPassengersCount: { type: integer }
                    asTransactionCodes: { type: array, items: { type: string } }
                    oPriceRequest: { $ref: '#/components/schemas/IpwsPriceRequest' }
      responses:
        '200': { description: Result, content: { application/json: { schema: { $ref: '#/components/schemas/IpwsDataResponse' } } } }

  /IP.svc/GetStationInfo:
    post:
