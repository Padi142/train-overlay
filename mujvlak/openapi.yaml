        sDocName: { type: string, nullable: true }
        sCardName: { type: string, nullable: true }
        sCardType: { type: string, nullable: true }
        sEmail: { type: string, nullable: true }
        sIkNum: { type: string, nullable: true }
        sAzakID: { type: string, nullable: true }
        sProductCategory: { type: string, nullable: true }
        sCommuterBaseTransCode: { type: string, nullable: true }
        sCommuterActivations: { type: string, nullable: true }
        sReturnReason: { type: string, nullable: true }
        sLastChange: { type: string, nullable: true }
        dtDate: { type: string, format: date-time, nullable: true }
        iFlags: { type: integer }
        iBackDayDiff: { type: integer }
        iCommuterType: { type: integer }
        oFrom: { $ref: '#/components/schemas/IpwsTicketStation' }
        oTo: { $ref: '#/components/schemas/IpwsTicketStation' }
        aoThere: { type: array, items: { $ref: '#/components/schemas/IpwsTicketTrain' } }
        aoBack: { type: array, items: { $ref: '#/components/schemas/IpwsTicketTrain' } }
        aoVia: { type: array, items: { type: object } }
        aoChange: { type: array, items: { type: object } }
        aoData: { type: array, items: { type: object } }
      additionalProperties: true

    IpwsTicketStation:
      type: object
      properties:
        iStationKey: { type: integer }
        sStationName: { type: string }
        dtTime: { type: string, format: date-time, nullable: true }

    IpwsTicketTrain:
      type: object
      properties:
        sTrainNum: { type: string }
        sTrainName: { type: string }
        sTrainType: { type: string }
        oFrom: { $ref: '#/components/schemas/IpwsTicketStation' }
        oTo: { $ref: '#/components/schemas/IpwsTicketStation' }
