        iFlags: { type: integer }
        iDelayColor: { type: integer }
        iOccupancyLevel: { type: integer }
        iOperationalFlags: { type: integer }
        sDelay: { type: string, nullable: true }
        aoTrains: { type: array, items: { type: object } }
        oPriceOffer: { type: object, nullable: true }

    IpwsPriceData:
